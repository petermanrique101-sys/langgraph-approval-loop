[project]
name = "approval-loop"
version = "0.1.0"
description = "An approval-gated tool loop on LangGraph: interrupt() + a SQLite checkpointer, with a policy node ported from a hand-rolled agent runtime."
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langchain>=1.0,<2",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["approval_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
